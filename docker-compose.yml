services:
  mongodb:
    image: mongo:8
    container_name: tailor-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: tailor-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - mongodb

volumes:
  mongodb_data:
